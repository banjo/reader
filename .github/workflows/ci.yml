name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck, lint, build, and tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:15.3
                env:
                    POSTGRES_USER: banjo
                    POSTGRES_PASSWORD: banjo
                    POSTGRES_DB: banjo-rss
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U banjo -d banjo-rss"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7.0
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql://banjo:banjo@localhost:5432/banjo-rss
            TEST_DATABASE_URL: postgresql://banjo:banjo@localhost:5432/banjo-rss
            TEST_REDIS_URL: redis://localhost:6379

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 8.6.3

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm --filter db db:generate

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint:all

            - name: Build
              run: pnpm build

            - name: Server tests
              run: pnpm exec tsx --test packages/server/tests/*.test.ts

            - name: API tests
              env:
                  RATE_LIMIT_DISABLED: "true"
              run: pnpm exec tsx --tsconfig apps/api/tsconfig.json --test apps/api/tests/*.test.ts

            - name: Web tests
              run: pnpm exec tsx --tsconfig apps/web/tsconfig.json --test apps/web/tests/*.test.ts
